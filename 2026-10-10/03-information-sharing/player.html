<script>
// Review-only transport: plays the same authored paused GSAP timelines.
// Clock/network use here belongs to the preview UI, never the export composition.
const film=document.getElementById('film');let current=0,playing=false,last=0,muted=false,ready=false;
const hosts=[...document.querySelectorAll('[data-composition-src]')];
const audio=[...document.querySelectorAll('audio')];
function resize(){film.style.width='1080px';film.style.height='1920px';film.style.transformOrigin='0 0';film.style.transform=`scale(${innerWidth/1080})`;}resize();addEventListener('resize',resize);
function syncMedia(t,force=false){for(const el of audio){const start=+el.dataset.start,du=+el.dataset.duration,active=t>=start&&t<start+du;el.volume=+el.dataset.volume||1;if(!active||!playing||muted){el.pause();continue;}const expected=t-start;if(force||Math.abs(el.currentTime-expected)>.16)el.currentTime=expected;if(el.paused)el.play().catch(()=>parent.postMessage({type:'audio-blocked'},location.origin));}}
function seek(t,force=false){current=Math.max(0,Math.min(t,120));const view=Math.min(current,119.999);for(const host of hosts){const start=+host.dataset.start,du=+host.dataset.duration;const local=view-start;host.style.display=local>=0&&local<du?'block':'none';const tl=window.__timelines[host.dataset.compositionId];if(tl)tl.seek(Math.max(0,Math.min(local,du)),false);for(const clip of host.querySelectorAll('.clip')){const cs=+clip.dataset.start,cd=+clip.dataset.duration;clip.style.display=local>=cs&&local<cs+cd?'block':'none';}}syncMedia(current,force);parent.postMessage({type:'time',time:current,playing,ready},location.origin);}
function tick(now){if(playing){current+=(now-last)/1000;if(current>=120){current=120;playing=false;}seek(current);}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
addEventListener('message',e=>{if(e.origin!==location.origin||!ready)return;const d=e.data;if(d.type==='play'){if(current>=120)current=0;playing=!playing;last=performance.now();seek(current,true);}if(d.type==='seek'){seek(+d.time,true);}if(d.type==='mute'){muted=!!d.value;seek(current,true);}});
(async()=>{for(const host of hosts){const source=await(await fetch(host.dataset.compositionSrc)).text();const doc=new DOMParser().parseFromString(source,'text/html');const temp=doc.querySelector('template');host.replaceChildren(temp.content.cloneNode(true));for(const script of host.querySelectorAll('script'))new Function(script.textContent)();}await document.fonts.ready;ready=true;seek(0,true);parent.postMessage({type:'ready'},location.origin);})().catch(error=>parent.postMessage({type:'error',message:error.message},location.origin));
</script></body></html>
