<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전설의대한뉘우스 · v7.1</title><style>
@font-face{font-family:Pretendard;src:url(assets/PretendardVariable.woff2);font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#10283f;font-family:Pretendard,sans-serif}main{max-width:1040px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 9px;letter-spacing:-1px}p{font-size:14px;color:#536778}nav,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{font:650 14px Pretendard;padding:10px 15px;border:1px solid #d5dde5;border-radius:999px;background:#fff;color:#10283f;cursor:pointer}button.active{background:#102d4e;color:white}button:disabled{opacity:.4;cursor:wait}.viewer{width:min(100%,390px);aspect-ratio:9/16;background:#102338;margin:auto;overflow:hidden}.viewer.wide{width:100%;aspect-ratio:16/9}iframe{display:block;width:100%;height:100%;border:0}.controls{justify-content:center}.foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:20px}a{color:#245f9e}#status{text-align:center;font-size:13px}
</style></head><body><main><h1>전설의대한뉘우스 · v7.1</h1><p>기존 승인 나레이션 · 핵심 자막만</p><nav><button data-mode="short" class="active">쇼츠</button><button data-mode="wide">롱폼</button><button data-mode="photo">자료사진</button></nav><div class="viewer"><iframe src="short.html" title="간결한 자막과 기존 나레이션 시안" allow="autoplay; fullscreen"></iframe></div><div class="controls"><button id="play" disabled>▶ 소리와 함께 재생</button><button id="pause" disabled>일시정지</button></div><p id="status">불러오는 중</p><div class="foot"><a href="credits.html">자료 출처</a><span>프레임 검토 예시</span></div></main><script>
const frame=document.querySelector('iframe');let mode='short';const controls=[...document.querySelectorAll('.controls button')];frame.addEventListener('load',()=>{controls.forEach(b=>b.disabled=false);document.querySelector('#status').textContent=mode==='photo'?'':'기존 나레이션 재사용';});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;controls.forEach(x=>x.disabled=true);frame.src=mode+'.html';document.querySelector('.viewer').classList.toggle('wide',mode==='wide');document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('.controls').style.display=mode==='photo'?'none':'flex';document.querySelector('#status').textContent='불러오는 중';});document.querySelector('#play').onclick=()=>frame.contentWindow.postMessage({action:'play'},location.origin);document.querySelector('#pause').onclick=()=>frame.contentWindow.postMessage({action:'pause'},location.origin);addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='play-result')document.querySelector('#status').textContent=e.data.ok?'재생 중':'재생을 다시 눌러 주세요';});
</script></body></html>
